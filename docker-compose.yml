# ERPNext v16 — Coolify deployment
# Project: concreteinfo | App: erpnext-16
#
# Prerequisites (set in Coolify environment editor):
#   DB_HOST, DB_PORT (pointing to existing shared-mariadb on coolify network)
#
# Coolify builds the image from Containerfile at repo root.
# SSL and domain routing handled by Coolify's built-in Traefik.
# Redis cache + queue are embedded in this compose (bench-specific).
# MariaDB is the existing shared-mariadb in the "shared" Coolify project.

x-customizable-image: &customizable_image
  image: ${CUSTOM_IMAGE:-erpnext-16}:${CUSTOM_TAG:-latest}
  build:
    context: .
    dockerfile: Containerfile
    args:
      - FRAPPE_BRANCH=${FRAPPE_BRANCH:-version-16}
  pull_policy: ${PULL_POLICY:-build}
  restart: ${RESTART_POLICY:-unless-stopped}

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *customizable_image]
  platform: linux/amd64
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  networks:
    - bench-network
    - coolify

services:

  # ── Redis (bench-specific, embedded) ──────────────────────────────────────────

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    # No persistence — cache is ephemeral by design
    networks:
      - bench-network

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    # Persist queue data so background jobs survive container restarts
    volumes:
      - redis-queue-data:/data
    networks:
      - bench-network

  # ── Configurator (one-shot) ───────────────────────────────────────────────────
  # Writes common_site_config.json with DB/Redis connection info.
  # All other services wait for this to complete before starting.
  # Note: only *customizable_image is merged — NOT *depends_on_configurator,
  # since configurator must not depend on itself.
  configurator:
    <<: *customizable_image
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      REDIS_CACHE: ${REDIS_CACHE:-redis-cache:6379}
      REDIS_QUEUE: ${REDIS_QUEUE:-redis-queue:6379}
      SOCKETIO_PORT: 9000
    depends_on:
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    restart: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - bench-network
      - coolify

  # ── Application services ──────────────────────────────────────────────────────

  backend:
    <<: *backend_defaults

  frontend:
    <<: *customizable_image
    platform: linux/amd64
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      # Site name must match the Frappe site created with bench new-site
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-erp.concreteinfo.co.in}
      # Real IP passthrough: trust Coolify's Traefik on the Docker bridge network
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-172.0.0.0/8}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-on}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - bench-network
      # coolify network required so Coolify's Traefik can reach the frontend
      # container to route erp.concreteinfo.co.in traffic.
      - coolify
    depends_on:
      - backend
      - websocket
    # Port 8080 is exposed internally — Coolify's Traefik routes the domain here.
    # Do NOT bind to a host port; let Coolify manage the routing.
    expose:
      - "8080"

  websocket:
    <<: [*depends_on_configurator, *customizable_image]
    platform: linux/amd64
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - bench-network
      - coolify

  queue-short:
    <<: *backend_defaults
    command: bench worker --queue short,default

  queue-long:
    <<: *backend_defaults
    # long worker also consumes short,default as fallback coverage
    command: bench worker --queue long,default,short

  scheduler:
    <<: *backend_defaults
    command: bench schedule

volumes:
  sites:
  redis-queue-data:

networks:
  # Internal network for service-to-service communication within this bench
  bench-network:
    name: erpnext-16-bench

  # Coolify's managed network — connects to shared MariaDB and Traefik proxy
  coolify:
    external: true
